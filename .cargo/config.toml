# 可选构建输入：craft-fonts（界面中文字体 = 霞鹜文楷，与 PdfCraft 同一份输入）。
#
# 这里刻意不写死字体路径：默认不嵌入，缺字体时构建仍然成功，
# 只是界面里的中文会退化成缺字方框。想要嵌入中文字体时，克隆它并用
# 环境变量指向绝对路径再构建：
#   git clone https://github.com/storytold/craft-fonts ../craft-fonts
#   PowerShell:  $env:CRAFT_FONTS_DIR = (Resolve-Path ..\craft-fonts).Path; cargo build --release
#   bash:        CRAFT_FONTS_DIR="$(cd ../craft-fonts && pwd)" cargo build --release
[env]
CRAFT_FONTS_REQUIRED = "0"